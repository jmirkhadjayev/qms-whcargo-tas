      type: string
      description: |-
        * `REGISTERED` - Ro‘yxatdan o‘tkazildi
        * `AWAITING_PREP` - Tayyorlashni kutmoqda
        * `PREP_STARTED` - Tayyorlash boshlandi
        * `CARGO_READY` - Yuk tayyorlandi
        * `AWAITING_DOCK` - Dok belgilanishini kutmoqda
        * `DOCK_ASSIGNED` - Dok belgilandi
        * `CALLED` - Mijoz chaqirildi
        * `ARRIVED` - Mijoz yetib keldi
        * `RELEASE_STARTED` - Yuk berish boshlandi
        * `RELEASED` - Yuk berish yakunlandi
        * `PARTIALLY_RELEASED` - Qisman berildi
        * `AWAITING_CHECKPOINT` - NO‘Pda tasdiqlashni kutmoqda
        * `EXIT_CONFIRMED` - Chiqib ketish tasdiqlandi
        * `SUSPENDED` - To‘xtatib turildi
        * `CANCELLED` - Bekor qilindi
        * `CLOSED` - Yopildi
