      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Navbat sanasi (YYYY-MM-DD)
      - in: query
        name: dock
        schema:
          type: string
        description: Dok kodi (D-01)
      - in: query
        name: q
        schema:
          type: string
        description: AWB yoki navbat raqami
      - in: query
        name: shift
        schema:
          type: integer
        description: Smena ID
      - in: query
        name: status
        schema:
          type: string
        description: Holat kodlari, vergul bilan
      tags:
      - requests
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueueRequest'
          description: ''
