    RequestStatusEnum:
      enum:
      - REGISTERED
      - AWAITING_PREP
      - PREP_STARTED
      - CARGO_READY
      - AWAITING_DOCK
      - DOCK_ASSIGNED
      - CALLED
      - ARRIVED
      - RELEASE_STARTED
      - RELEASED
      - PARTIALLY_RELEASED
      - AWAITING_CHECKPOINT
      - EXIT_CONFIRMED
      - SUSPENDED
      - CANCELLED
